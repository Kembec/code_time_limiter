<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Code Time Limiter</title>
  <desc>Marketplace icon source. Export: images/icon.png at 256 x 256.</desc>
  <!--
    Colours: only Personal/_marca/04-sistema/design-tokens.json; each class is named after its token.
    The head is the brand's trazado, copied verbatim from 01-logo/iconos/kembec-icono-blanco-512.svg:
    move or scale it only through its transform, never edit the d attribute.
    Invariants:
    - The countdown runs clockwise from the crown (12 o'clock, the limit). Elapsed time is a solid
      stroke; the time left is dots, the brand's pending state.
    - "Now" (end of the solid arc) sits at 293.2 deg, on the ray from the ring centre through the
      beak tip, so the crow points at the current moment.
    - Clearspace: the beak tip is H/4 (H = visible head height) inside the ring's inner edge;
      head scale = (R - stroke/2) / (enclosing radius 84.02 + 108.5 / 4) = 88 / 111.15.
  -->
  <style>
    .ink { fill: #000000; }
    .paper { fill: #FFFFFF; }
    .paper-stroke { fill: none; stroke: #FFFFFF; stroke-width: 20; stroke-linecap: round; }
  </style>
  <rect id="field" class="ink" width="256" height="256"/>
  <g id="countdown">
    <path id="elapsed" class="paper-stroke" d="M128 40A98 98 0 1 1 37.92 99.39"/>
    <g id="pending" class="paper">
      <circle cx="53.82" cy="73.95" r="8"/>
      <circle cx="74.96" cy="55.59" r="8"/>
      <circle cx="100.43" cy="43.96" r="8"/>
    </g>
    <g id="crown" class="paper">
      <rect x="118" y="18" width="20" height="16"/>
      <rect x="102" y="8" width="52" height="16" rx="8"/>
    </g>
  </g>
